workflows:
  beta_distribution:
    name: Beta Build and Distribution
    environment:
      vars:
        # Firebase App Distribution token and App ID are fetched from your environment variables
        FIREBASE_TOKEN: $FIREBASE_TOKEN
        FIREBASE_APP_ID: $FIREBASE_APP_ID
    scripts:
      - name: Install dependencies
        script: |
          ./gradlew clean assembleRelease
      - name: Run tests
        script: |
          ./gradlew clean assembleRelease
      - name: Build APK
        script: |
          ./gradlew assembleRelease
      - name: Distribute via Firebase App Distribution
        script: |
          # Install Firebase CLI if not already available
          npm install -g firebase-tools
          firebase appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app $FIREBASE_APP_ID \
            --testers "kengyap@upm.edu.my" \
            --token $FIREBASE_TOKEN \
            --release-notes "Automated build from Codemagic"
    artifacts:
      - app/build/outputs/apk/release/app-release.apk
    publishing:
      scripts:
        - echo "Beta build and distribution completed successfully."
